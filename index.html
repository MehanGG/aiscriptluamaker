<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTPS Script AI Studio</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing (Code blocks) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* Security & Anti-Highlight */
        body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; background-color: #000000; }
        * { -webkit-tap-highlight-color: transparent !important; outline: none !important; }
        *:focus { outline: none !important; box-shadow: none !important; }
        
        .allow-select, pre, code, details {
            -webkit-user-select: text !important; -moz-user-select: text !important; -ms-user-select: text !important; user-select: text !important;
        }

        /* Styling Gambar Hasil AI */
        img { max-width: 100%; height: auto; border-radius: 12px; margin-top: 10px; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        
        /* UI Effects & Animations */
        @keyframes pop-in { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        .animate-pop-in { animation: pop-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        details.think-box summary::-webkit-details-marker { display: none; }
        details.think-box summary { list-style: none; cursor: pointer; }
        
        /* Markdown Text Styling for AI (No Bubble) */
        .ai-text p { margin-bottom: 12px; line-height: 1.6; }
        .ai-text ul, .ai-text ol { margin-left: 20px; margin-bottom: 12px; }
        .ai-text li { margin-bottom: 6px; }
        .ai-text strong { color: #ffffff; }
    </style>
</head>
<body class="text-gray-200 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Top Header -->
    <header class="px-4 py-3 flex justify-between items-center z-30 relative">
        <button onclick="toggleNavMenu(event)" class="text-gray-300 hover:text-white p-2 text-lg">
            <i class="fas fa-bars"></i>
        </button>
        
        <!-- Active Model Indicator -->
        <button onclick="openSettings()" class="flex items-center gap-2 bg-[#1e1e1e] hover:bg-[#2a2a2a] transition-colors px-4 py-2 rounded-full cursor-pointer">
            <span id="active-model-display" class="text-[13px] font-semibold text-gray-200 tracking-wide">
                Memuat Model... <i class="fas fa-chevron-down text-[10px] ml-1 opacity-70"></i>
            </span>
        </button>
        
        <button onclick="clearLocalSession(event)" class="text-gray-300 hover:text-white p-2 text-lg" title="Hapus Sesi">
            <i class="fas fa-redo"></i>
        </button>

        <!-- Dropdown Menu -->
        <div id="nav-dropdown" class="hidden absolute top-14 left-4 w-56 bg-[#1e1e1e] border border-[#333] rounded-2xl shadow-2xl overflow-hidden z-50 flex flex-col text-left">
            <a href="#" onclick="startNewChat(event)" class="px-4 py-3.5 hover:bg-[#2a2a2a] text-sm text-white flex items-center gap-3 transition-colors border-b border-[#333]"><i class="fas fa-plus text-blue-400 w-4 text-center"></i> Chat Baru</a>
            <a href="#" onclick="toggleHistoryModal(event)" class="px-4 py-3.5 hover:bg-[#2a2a2a] text-sm text-gray-200 flex items-center gap-3 transition-colors"><i class="fas fa-history text-emerald-400 w-4 text-center"></i> Riwayat Chat</a>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto px-4 md:px-10 py-6 flex flex-col gap-6 scroll-smooth z-10 w-full max-w-4xl mx-auto">
        <!-- Welcome Message -->
        <div class="flex flex-col gap-2 w-full text-center mt-10">
            <i class="fas fa-microchip text-4xl text-blue-500 mb-2"></i>
            <h2 class="text-2xl font-bold text-white">GTPS Studio AI</h2>
            <p class="text-sm text-gray-400">Siap membantu Anda membuat script GTPS Cloud.</p>
        </div>
    </main>

    <!-- Attachment Preview Container -->
    <div id="attachment-preview-container" class="px-4 hidden mb-2 max-w-4xl mx-auto w-full">
        <div class="bg-[#1e1e1e] p-2 rounded-2xl flex flex-wrap gap-2 max-h-24 overflow-y-auto">
            <!-- File previews go here -->
        </div>
    </div>

    <!-- Input Area (Pill Shape) -->
    <footer class="p-4 z-20 w-full max-w-4xl mx-auto">
        <form id="chat-form" onsubmit="handleFormSubmit(event)" class="bg-[#1a1a1c] border border-[#2a2a2c] rounded-[28px] flex flex-col px-2 py-2 relative shadow-lg">
            <input type="file" id="file-input" class="hidden" accept="image/*,.txt,.lua" multiple>

            <div class="flex items-end gap-2 w-full">
                <button type="button" onclick="document.getElementById('file-input').click()" class="p-3 text-gray-400 hover:text-white rounded-full flex-shrink-0 transition-colors">
                    <i class="fas fa-plus text-lg"></i>
                </button>
                
                <textarea id="user-input" rows="1" class="allow-select flex-1 bg-transparent text-white py-3.5 px-1 resize-none focus:outline-none text-[15px] leading-relaxed max-h-32 overflow-y-auto" placeholder="Minta Gemini" oninput="this.style.height = '';this.style.height = Math.min(this.scrollHeight, 128) + 'px'"></textarea>
                
                <button type="button" onclick="openSettings()" class="p-3 text-gray-400 hover:text-white rounded-full flex-shrink-0 transition-colors" title="Setelan AI">
                    <i class="fas fa-sliders-h text-lg"></i>
                </button>
                
                <button type="submit" id="send-btn" class="bg-blue-600 hover:bg-blue-500 text-white w-10 h-10 mb-1 mr-1 rounded-full flex items-center justify-center shrink-0 transition-colors disabled:opacity-50">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </form>
    </footer>

    <!-- History Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 transition-opacity">
        <div class="bg-[#1e1e1e] rounded-3xl w-full max-w-md p-6 relative max-h-[80vh] flex flex-col">
            <button type="button" onclick="toggleHistoryModal(event)" class="absolute top-5 right-5 text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-xl font-bold text-white mb-4">Riwayat Chat</h2>
            <div id="history-list-container" class="flex-1 overflow-y-auto space-y-2 custom-scrollbar"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[60] transition-opacity">
        <div class="bg-[#1e1e1e] rounded-3xl w-full max-w-md p-6 relative" id="modal-content">
            <button onclick="closeSettings()" class="absolute top-5 right-5 text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-xl font-bold mb-6 text-white">Setelan Jaringan AI</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">Provider AI</label>
                    <select id="ai-provider" onchange="onProviderChange()" class="w-full bg-[#121212] border border-[#333] rounded-xl px-4 py-3 text-white outline-none">
                        <option value="gemini">Google Gemini AI</option>
                        <option value="openai">OpenAI (ChatGPT)</option>
                        <option value="claude">Anthropic Claude</option>
                        <option value="deepseek">DeepSeek AI</option>
                        <option value="kimi">Kimi (Moonshot AI)</option>
                    </select>
                </div>
                <div>
                    <label id="api-key-label" class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">API Key</label>
                    <input type="password" id="api-key-input" class="allow-select w-full bg-[#121212] border border-[#333] rounded-xl px-4 py-3 text-white outline-none" placeholder="Masukkan API Key...">
                </div>
                <button id="save-btn" onclick="saveAndFetchModels()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-colors">
                    Verifikasi Key & Tarik Model
                </button>
                <div id="model-section" class="hidden pt-2">
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">Pilih Model</label>
                    <select id="ai-model" onchange="saveActiveModel()" class="w-full bg-[#121212] border border-blue-500/50 rounded-xl px-4 py-3 text-white outline-none"></select>
                </div>
                <div id="status-message" class="text-xs hidden rounded-lg p-3 font-medium"></div>
            </div>
        </div>
    </div>

    <script>
        let chatHistory = [];
        let typingInterval = null;

        const encKey = str => btoa(encodeURIComponent(str));
        const decKey = str => decodeURIComponent(atob(str));

        window.addEventListener('DOMContentLoaded', () => {
            updateModelDisplay();
            const savedHistory = localStorage.getItem('_local_chat_history');
            if (savedHistory) {
                try {
                    chatHistory = JSON.parse(savedHistory);
                    document.getElementById('chat-container').innerHTML = ''; // Clear welcome text
                    chatHistory.forEach(c => appendMessage(c.role === 'assistant' ? 'ai' : 'user', c.content, [], null, false));
                } catch(e) {}
            }
        });

        function clearLocalSession(e) {
            e.preventDefault();
            localStorage.removeItem('_local_chat_history');
            location.reload();
        }

        function startNewChat(e) {
            e.preventDefault();
            document.getElementById('nav-dropdown').classList.add('hidden');
            chatHistory = [];
            localStorage.removeItem('_local_chat_history');
            document.getElementById('chat-container').innerHTML = `
                <div class="flex flex-col gap-2 w-full text-center mt-10">
                    <i class="fas fa-microchip text-4xl text-blue-500 mb-2"></i>
                    <h2 class="text-2xl font-bold text-white">Sesi Chat Baru</h2>
                    <p class="text-sm text-gray-400">Silakan mulai diskusi coding Anda.</p>
                </div>`;
        }

        function toggleHistoryModal(e) {
            e.preventDefault();
            document.getElementById('nav-dropdown').classList.add('hidden');
            const modal = document.getElementById('history-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
            if (!modal.classList.contains('hidden')) {
                const listCont = document.getElementById('history-list-container');
                listCont.innerHTML = chatHistory.length ? '' : '<p class="text-sm text-gray-500 text-center py-4">Kosong.</p>';
                chatHistory.forEach(item => {
                    listCont.innerHTML += `<div class="bg-[#2a2a2a] p-3 rounded-xl mb-2 text-xs"><span class="${item.role==='user'?'text-blue-400':'text-emerald-400'} font-bold uppercase">${item.role}</span><p class="text-gray-300 truncate mt-1">${escapeHTML(item.content)}</p></div>`;
                });
            }
        }

        function toggleNavMenu(e) { e.stopPropagation(); document.getElementById('nav-dropdown').classList.toggle('hidden'); }
        document.addEventListener('click', () => { const m = document.getElementById('nav-dropdown'); if(m) m.classList.add('hidden'); });

        /* =========================================
           ATTACHMENTS
           ========================================= */
        let attachedFiles = [];
        document.getElementById('file-input').addEventListener('change', function(e) {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    attachedFiles.push({ name: file.name, type: file.type.startsWith('image/') ? 'image' : 'text', mimeType: file.type || 'text/plain', content: file.type.startsWith('image/') ? ev.target.result.split(',')[1] : ev.target.result });
                    updateAttachmentUI();
                };
                if(file.type.startsWith('image/')) reader.readAsDataURL(file); else reader.readAsText(file);
            });
        });

        function updateAttachmentUI() {
            const pc = document.getElementById('attachment-preview-container');
            const fl = pc.querySelector('div');
            if(attachedFiles.length === 0) { pc.classList.add('hidden'); return; }
            pc.classList.remove('hidden');
            fl.innerHTML = '';
            attachedFiles.forEach(f => {
                fl.innerHTML += `<div class="bg-[#2a2a2c] px-3 py-1.5 rounded-lg text-xs text-gray-300 flex items-center gap-2"><span>${f.name}</span></div>`;
            });
        }
        function clearAllAttachments() { attachedFiles = []; updateAttachmentUI(); }

        /* =========================================
           MARKDOWN RENDERER
           ========================================= */
        const renderer = {
            code(token) {
                const codeText = typeof token === 'object' ? token.text : token;
                const lang = typeof token === 'object' ? token.lang : arguments[1] || 'CODE';
                return `<div class="relative my-4 rounded-2xl overflow-hidden bg-[#161618] border border-[#2a2a2c] w-full">
                    <div class="flex justify-between items-center px-4 py-2.5 bg-[#1e1e20] text-xs text-gray-400 font-semibold tracking-wide">
                        <span>${lang}</span>
                        <button type="button" onclick="copyCode(this)" class="hover:text-white transition-colors flex items-center gap-2"><i class="fas fa-copy"></i> Copy</button>
                    </div>
                    <pre class="p-4 text-[13px] text-gray-300 font-mono overflow-x-auto allow-select"><code>${escapeHTML(codeText)}</code></pre>
                </div>`;
            }
        };
        marked.use({ renderer });
        window.copyCode = function(btn) {
            navigator.clipboard.writeText(btn.closest('.relative').querySelector('code').innerText);
            btn.innerHTML = '<i class="fas fa-check text-green-400"></i> Copied';
            setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> Copy', 2000);
        };

        /* =========================================
           SETTINGS & MODELS
           ========================================= */
        function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
            const savedProvider = localStorage.getItem('_active_provider') || 'gemini';
            document.getElementById('ai-provider').value = savedProvider;
            onProviderChange();
        }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); document.getElementById('settings-modal').classList.remove('flex'); updateModelDisplay(); }
        
        function onProviderChange() {
            const p = document.getElementById('ai-provider').value;
            document.getElementById('api-key-label').textContent = `${p.toUpperCase()} API Key`;
            const saved = localStorage.getItem(`_key_${p}`);
            document.getElementById('api-key-input').value = saved ? decKey(saved) : '';
        }

        async function saveAndFetchModels() {
            const p = document.getElementById('ai-provider').value;
            const key = document.getElementById('api-key-input').value.trim();
            if(!key) return;
            localStorage.setItem(`_key_${p}`, encKey(key));
            localStorage.setItem('_active_provider', p);
            
            // Auto mock models for demo
            const sel = document.getElementById('ai-model');
            if(p === 'gemini') sel.innerHTML = '<option value="gemini-2.5-flash">Gemini 2.5 Flash</option><option value="gemini-2.5-pro">Gemini 2.5 Pro</option>';
            else sel.innerHTML = `<option value="default-model">${p.toUpperCase()} Default Model</option>`;
            
            document.getElementById('model-section').classList.remove('hidden');
            saveActiveModel();
            
            const status = document.getElementById('status-message');
            status.className = 'text-xs rounded-lg p-3 font-medium bg-green-900/40 text-green-400 mt-3 block';
            status.innerHTML = 'Berhasil menyimpan & verifikasi key!';
        }
        function saveActiveModel() { 
            localStorage.setItem('_active_provider', document.getElementById('ai-provider').value); 
            localStorage.setItem(`_model_${document.getElementById('ai-provider').value}`, document.getElementById('ai-model').value);
            updateModelDisplay();
        }
        function updateModelDisplay() {
            const p = localStorage.getItem('_active_provider') || 'Belum Diatur';
            const m = localStorage.getItem(`_model_${p}`) || p;
            let display = m.replace('gemini-2.5-', 'Gemini 2.5 ').replace('flash', 'Flash-Lite Mendalam').replace('gpt-4', 'GPT-4');
            if (display.length > 25) display = display.substring(0, 25) + '...';
            document.getElementById('active-model-display').innerHTML = `${display} <i class="fas fa-chevron-down text-[10px] ml-1 opacity-70"></i>`;
        }

        /* =========================================
           CHAT RENDERING
           ========================================= */
        function appendMessage(sender, text, files = [], metadata = null, saveLocal = true) {
            const cc = document.getElementById('chat-container');
            const wrap = document.createElement('div');
            wrap.className = `flex w-full ${sender === 'user' ? 'justify-end' : 'justify-start'} mb-2`;
            
            const contentDiv = document.createElement('div');
            
            let html = '';
            
            // Rendering Attachments
            if (files && files.length > 0) {
                html += `<div class="flex flex-wrap gap-2 mb-2">`;
                files.forEach(f => {
                    html += `<div class="bg-[#2a2a2c] px-3 py-1.5 rounded-lg text-[11px] text-gray-300 font-mono"><i class="fas fa-file-code"></i> ${f.name}</div>`;
                });
                html += `</div>`;
            }

            if (sender === 'user') {
                contentDiv.className = 'bg-[#1e1e1e] text-white px-5 py-3 rounded-[28px] max-w-[85%] text-[15px] leading-relaxed shadow-sm allow-select';
                html += `<p class="whitespace-pre-wrap">${escapeHTML(text)}</p>`;
            } else {
                contentDiv.className = 'w-full ai-text text-gray-200 text-[15px] leading-relaxed allow-select overflow-hidden';
                
                const thinkMatch = text.match(/<think>([\s\S]*?)<\/think>/i);
                if (thinkMatch) {
                    html += `<details class="think-box mb-4 bg-[#161618] border border-[#2a2a2c] rounded-2xl p-1" open>
                                <summary class="px-3 py-2 text-xs font-semibold text-gray-400 flex items-center gap-2"><i class="fas fa-brain text-blue-400"></i> Proses Pemikiran</summary>
                                <div class="p-3 pt-1 text-[13px] text-gray-500 font-mono whitespace-pre-wrap">${escapeHTML(thinkMatch[1].trim())}</div>
                             </details>`;
                    html += marked.parse(text.replace(/<think>([\s\S]*?)<\/think>/i, '').trim());
                } else {
                    html += marked.parse(text);
                }
            }
            
            contentDiv.innerHTML = html;
            wrap.appendChild(contentDiv);
            
            // Remove empty welcome element if exists
            const welcomeMsg = cc.querySelector('.text-center.mt-10');
            if (welcomeMsg) welcomeMsg.remove();

            cc.appendChild(wrap);
            cc.scrollTo({ top: cc.scrollHeight, behavior: 'smooth' });

            if(saveLocal) {
                chatHistory.push({ role: sender === 'ai' ? 'assistant' : 'user', content: text });
                localStorage.setItem('_local_chat_history', JSON.stringify(chatHistory));
            }
        }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)); }

        function appendTyping() {
            const cc = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.id = 'typing';
            div.className = 'flex w-full justify-start mb-2';
            div.innerHTML = `<div class="text-blue-400 text-lg flex gap-1 items-center px-2 py-4"><i class="fas fa-circle text-[8px] animate-pulse"></i><i class="fas fa-circle text-[8px] animate-pulse" style="animation-delay:0.2s"></i><i class="fas fa-circle text-[8px] animate-pulse" style="animation-delay:0.4s"></i></div>`;
            cc.appendChild(div);
            cc.scrollTo({ top: cc.scrollHeight, behavior: 'smooth' });
        }
        function removeTyping() { const el = document.getElementById('typing'); if(el) el.remove(); }

        /* =========================================
           API EXECUTION & MASSIVE SYSTEM PROMPT
           ========================================= */
        const SYSTEM_PROMPT = `Kamu adalah AI ahli bahasa pemrograman Lua khusus untuk server GTPS Cloud (GTPS10).
Tugasmu adalah membuat, menganalisis, atau memperbaiki script Lua.

ATURAN FORMAT BALASAN:
- SEBELUM menuliskan blok kode script (\`\`\`lua), kamu WAJIB memberikan JUDUL SCRIPT terlebih dahulu dalam format teks biasa/bold (Misal: **Script Exchange Admin**).
- Tidak boleh ada block kode tanpa judul di atasnya.

INSTRUKSI WAJIB UNTUK PROSES BERPIKIR (THINKING):
Setiap kali kamu akan memberikan respon, kamu WAJIB melakukan pemikiran mendalam terlebih dahulu dengan tag <think>.

CONTOH SCRIPT (COMMAND KHUSUS ROLE 51):
\`\`\`lua
registerLuaCommand({ 
    command = "givegems", 
    roleRequired = 51, 
    description = "Memberikan gems ke player (Khusus Role ID 51)" 
})

onPlayerCommandCallback(function(world, player, fullCommand)
    if not world or not player or type(player.getName) ~= "function" then return false end
    local cmd, targetName, amountStr = string.match(fullCommand, "^/?(%S+)%s+(%S+)%s*(.*)$")
    if not cmd then cmd = string.lower(string.match(fullCommand, "^/?(%S+)") or "") end
    cmd = string.lower(cmd)

    if cmd == "givegems" then
        local hasRole51 = false
        if type(player.hasRole) == "function" and player:hasRole(51) then hasRole51 = true
        elseif type(player.getRole) == "function" and player:getRole() == 51 then hasRole51 = true end

        if not hasRole51 then
            player:onConsoleMessage("\`4[Error] Kamu tidak memiliki izin (Role ID 51)!")
            return true
        end

        if not targetName or targetName == "" or not amountStr or amountStr == "" then return true end
        local amount = tonumber(amountStr)
        
        local targetPlayer = nil
        local allPlayers = getServerPlayers()
        for _, p in ipairs(allPlayers) do
            if string.lower(p:getName()) == string.lower(targetName) then
                targetPlayer = p break
            end
        end

        if targetPlayer then
            targetPlayer:setGems(targetPlayer:getGems() + amount)
            player:onConsoleMessage("\`2Berhasil memberikan " .. amount .. " gems!")
        end
        return true
    end
    return false
end)
\`\`\`

REFERENSI API LENGKAP (GTPS CLOUD LUA API):
(Kamu memiliki akses penuh ke seluruh database objek GTPS: Player, World, Tile, Item, IOTM, Guild, ShopItem, GrowtopiaBot, Drop, DiscordBot, dll. Gunakan API standard seperti player:getNetID(), world:getTile(x,y), getItem(id), file.write/read, sqlite, registerLuaCommand, onPlayerDialogCallback, dll.)`;

        function handleFormSubmit(e) {
            e.preventDefault();
            const txt = document.getElementById('user-input').value.trim();
            if(!txt && attachedFiles.length === 0) return;
            document.getElementById('user-input').value = '';
            document.getElementById('user-input').style.height = 'auto';
            const att = [...attachedFiles];
            clearAllAttachments();
            
            appendMessage('user', txt || '[File Terlampir]', att, null, true);
            processAI(txt);
        }

        async function processAI(txt) {
            const p = localStorage.getItem('_active_provider');
            const encKeyVal = localStorage.getItem(`_key_${p}`);
            if(!encKeyVal) { openSettings(); return; }
            
            const apiKey = decKey(encKeyVal);
            const model = localStorage.getItem(`_model_${p}`) || 'gemini-2.5-flash';
            appendTyping();

            try {
                let resText = "";
                if(p === 'gemini') {
                    // History mapping for Gemini
                    const history = chatHistory.slice(0, -1).map(h => ({ role: h.role === 'assistant' ? 'model' : h.role, parts: [{ text: h.content }] }));
                    history.push({ role: 'user', parts: [{ text: txt }] });
                    
                    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ system_instruction: { parts: [{ text: SYSTEM_PROMPT }] }, contents: history, generationConfig: { temperature: 0.3 } })
                    });
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.error?.message || 'Error API');
                    resText = d.candidates[0].content.parts[0].text;
                } else {
