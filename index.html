<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTPS Script AI Studio</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; background-color: #000000; }
        * { -webkit-tap-highlight-color: transparent !important; outline: none !important; }
        *:focus { outline: none !important; box-shadow: none !important; }
        
        .allow-select, pre, code, details {
            -webkit-user-select: text !important; -moz-user-select: text !important; -ms-user-select: text !important; user-select: text !important;
        }

        img { max-width: 100%; height: auto; border-radius: 12px; margin-top: 10px; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        
        @keyframes pop-in { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        .animate-pop-in { animation: pop-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        details.think-box summary::-webkit-details-marker { display: none; }
        details.think-box summary { list-style: none; cursor: pointer; }
        
        .ai-text p { margin-bottom: 12px; line-height: 1.6; }
        .ai-text ul, .ai-text ol { margin-left: 20px; margin-bottom: 12px; }
        .ai-text li { margin-bottom: 6px; }
        .ai-text strong { color: #ffffff; }
    </style>
</head>
<body class="text-gray-200 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Top Header -->
    <header class="px-4 py-3 flex justify-between items-center z-30 relative">
        <button onclick="toggleNavMenu(event)" class="text-gray-300 hover:text-white p-2 text-lg">
            <i class="fas fa-bars"></i>
        </button>
        
        <!-- Active Model Indicator -->
        <button onclick="openSettings()" class="flex items-center gap-2 bg-[#1e1e1e] hover:bg-[#2a2a2a] transition-colors px-4 py-2 rounded-full cursor-pointer max-w-[60%]">
            <span id="active-model-display" class="text-[13px] font-semibold text-gray-200 tracking-wide truncate">
                Memuat Model... 
            </span>
            <i class="fas fa-chevron-down text-[10px] opacity-70 flex-shrink-0"></i>
        </button>
        
        <div class="w-8"></div> <!-- Spacer -->

        <!-- Dropdown Menu -->
        <div id="nav-dropdown" class="hidden absolute top-14 left-4 w-48 bg-[#1e1e1e] border border-[#333] rounded-2xl shadow-2xl overflow-hidden z-50 flex flex-col text-left">
            <a href="#" onclick="startNewChat(event)" class="px-4 py-3.5 hover:bg-[#2a2a2a] text-sm text-white flex items-center gap-3 transition-colors"><i class="fas fa-plus text-blue-400 w-4 text-center"></i> Chat Baru</a>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto px-4 md:px-10 py-6 flex flex-col gap-6 scroll-smooth z-10 w-full max-w-4xl mx-auto">
        <div class="flex flex-col gap-2 w-full text-center mt-10">
            <i class="fas fa-microchip text-4xl text-blue-500 mb-2"></i>
            <h2 class="text-2xl font-bold text-white">GTPS Studio AI</h2>
            <p class="text-sm text-gray-400">Siap membantu Anda membuat script GTPS Cloud.</p>
        </div>
    </main>

    <!-- Attachment Preview Container -->
    <div id="attachment-preview-container" class="px-4 hidden mb-2 max-w-4xl mx-auto w-full">
        <div class="bg-[#1e1e1e] p-2 rounded-2xl flex flex-wrap gap-2 max-h-24 overflow-y-auto"></div>
    </div>

    <!-- Input Area -->
    <footer class="p-4 z-20 w-full max-w-4xl mx-auto">
        <form id="chat-form" onsubmit="handleFormSubmit(event)" class="bg-[#1a1a1c] border border-[#2a2a2c] rounded-[28px] flex flex-col px-2 py-2 relative shadow-lg">
            <input type="file" id="file-input" class="hidden" accept="image/*,.txt,.lua" multiple>

            <div class="flex items-end gap-2 w-full">
                <button type="button" onclick="document.getElementById('file-input').click()" class="p-3 text-gray-400 hover:text-white rounded-full flex-shrink-0 transition-colors">
                    <i class="fas fa-plus text-lg"></i>
                </button>
                
                <textarea id="user-input" rows="1" class="allow-select flex-1 bg-transparent text-white py-3.5 px-1 resize-none focus:outline-none text-[15px] leading-relaxed max-h-32 overflow-y-auto" placeholder="Minta AI buatkan Script..." oninput="this.style.height = '';this.style.height = Math.min(this.scrollHeight, 128) + 'px'"></textarea>
                
                <button type="button" onclick="openImageModal()" class="p-3 text-gray-400 hover:text-blue-400 rounded-full flex-shrink-0 transition-colors" title="Buat Gambar PNG">
                    <i class="fas fa-image text-lg"></i>
                </button>
                
                <button type="submit" id="send-btn" class="bg-blue-600 hover:bg-blue-500 text-white w-10 h-10 mb-1 mr-1 rounded-full flex items-center justify-center shrink-0 transition-colors disabled:opacity-50">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </form>
    </footer>

    <!-- Settings Modal (AI Network) -->
    <div id="settings-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[60] transition-opacity">
        <div class="bg-[#1e1e1e] rounded-3xl w-full max-w-md p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeSettings()" class="absolute top-5 right-5 text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-xl font-bold mb-6 text-white">Setelan AI Provider</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">Pilih Provider</label>
                    <select id="ai-provider" onchange="onProviderChange()" class="w-full bg-[#121212] border border-[#333] rounded-xl px-4 py-3 text-white outline-none">
                        <option value="gemini">Google Gemini AI</option>
                        <option value="openai">OpenAI (ChatGPT)</option>
                        <option value="claude">Anthropic (Claude)</option>
                    </select>
                </div>
                <div>
                    <label id="api-key-label" class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">API Key</label>
                    <input type="password" id="api-key-input" class="allow-select w-full bg-[#121212] border border-[#333] rounded-xl px-4 py-3 text-white outline-none" placeholder="Masukkan API Key...">
                </div>
                
                <button id="btn-verify" onclick="saveAndFetchModels()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-colors flex justify-center items-center gap-2">
                    <i class="fas fa-sync-alt"></i> Simpan & Verifikasi Key
                </button>
                
                <div id="model-section" class="pt-2 hidden">
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">Pilih Model yang Tersedia</label>
                    <select id="ai-model" onchange="saveActiveModel()" class="w-full bg-[#121212] border border-blue-500/50 rounded-xl px-4 py-3 text-white outline-none">
                        <!-- Otomatis diisi oleh Javascript -->
                    </select>
                </div>
                
                <div id="status-message" class="text-xs hidden rounded-lg p-3 font-medium"></div>
            </div>
        </div>
    </div>

    <!-- Image Generation Modal -->
    <div id="image-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[70] transition-opacity">
        <div class="bg-[#1e1e1e] rounded-3xl w-full max-w-md p-6 relative">
            <button onclick="closeImageModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-xl font-bold mb-2 text-white"><i class="fas fa-magic text-purple-500"></i> Buat Gambar PNG</h2>
            <p class="text-xs text-gray-400 mb-6">Prompt AI menjadi gambar resolusi tinggi.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5 tracking-wider">Deskripsi Gambar (Inggris disarankan)</label>
                    <textarea id="img-prompt" rows="3" class="allow-select w-full bg-[#121212] border border-[#333] rounded-xl px-4 py-3 text-white outline-none resize-none" placeholder="A futuristic city cyberpunk..."></textarea>
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-gray-400 mb-1.5">Lebar (Width)</label>
                        <input type="number" id="img-width" value="1024" class="allow-select w-full bg-[#121212] border border-[#333] rounded-xl px-4 py-3 text-white outline-none">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-gray-400 mb-1.5">Tinggi (Height)</label>
                        <input type="number" id="img-height" value="1024" class="allow-select w-full bg-[#121212] border border-[#333] rounded-xl px-4 py-3 text-white outline-none">
                    </div>
                </div>
                <button id="btn-generate-img" onclick="generateImage()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 rounded-xl transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-paint-brush"></i> Generate Gambar
                </button>

                <div id="img-result-container" class="hidden flex-col items-center mt-4">
                    <img id="img-result" class="rounded-xl border border-[#333] shadow-lg max-h-48 object-cover mb-3" src="">
                    <button id="dl-img-btn" onclick="downloadGeneratedImage()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm transition-colors flex items-center gap-2">
                        <i class="fas fa-download"></i> Download PNG
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chatHistory = []; 
        let timerInterval = null;
        let aiStartTime = 0;
        let currentGeneratedImgUrl = "";

        const encKey = str => btoa(encodeURIComponent(str));
        const decKey = str => decodeURIComponent(atob(str));

        // Inisialisasi Tampilan
        updateModelDisplay();

        function startNewChat(e) {
            e.preventDefault();
            document.getElementById('nav-dropdown').classList.add('hidden');
            chatHistory = [];
            document.getElementById('chat-container').innerHTML = `
                <div class="flex flex-col gap-2 w-full text-center mt-10">
                    <i class="fas fa-microchip text-4xl text-blue-500 mb-2"></i>
                    <h2 class="text-2xl font-bold text-white">Sesi Chat Baru</h2>
                    <p class="text-sm text-gray-400">Silakan mulai diskusi coding Anda.</p>
                </div>`;
        }

        function toggleNavMenu(e) { e.stopPropagation(); document.getElementById('nav-dropdown').classList.toggle('hidden'); }
        document.addEventListener('click', () => { const m = document.getElementById('nav-dropdown'); if(m) m.classList.add('hidden'); });

        /* =========================================
           ATTACHMENTS
           ========================================= */
        let attachedFiles = [];
        document.getElementById('file-input').addEventListener('change', function(e) {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    attachedFiles.push({ 
                        name: file.name, 
                        type: file.type.startsWith('image/') ? 'image' : 'text', 
                        mimeType: file.type || 'text/plain', 
                        content: file.type.startsWith('image/') ? ev.target.result.split(',')[1] : ev.target.result 
                    });
                    updateAttachmentUI();
                };
                if(file.type.startsWith('image/')) reader.readAsDataURL(file); else reader.readAsText(file);
            });
        });

        function updateAttachmentUI() {
            const pc = document.getElementById('attachment-preview-container');
            const fl = pc.querySelector('div');
            if(attachedFiles.length === 0) { pc.classList.add('hidden'); return; }
            pc.classList.remove('hidden');
            fl.innerHTML = '';
            attachedFiles.forEach(f => {
                fl.innerHTML += `<div class="bg-[#2a2a2c] px-3 py-1.5 rounded-lg text-xs text-gray-300 flex items-center gap-2"><span>${f.name}</span></div>`;
            });
        }
        function clearAllAttachments() { attachedFiles = []; updateAttachmentUI(); }

        /* =========================================
           MARKDOWN RENDERER
           ========================================= */
        const renderer = {
            code(token) {
                const codeText = typeof token === 'object' ? token.text : token;
                const lang = typeof token === 'object' ? token.lang : arguments[1] || 'CODE';
                return `<div class="relative my-4 rounded-2xl overflow-hidden bg-[#161618] border border-[#2a2a2c] w-full">
                    <div class="flex justify-between items-center px-4 py-2.5 bg-[#1e1e20] text-xs text-gray-400 font-semibold tracking-wide">
                        <span>${lang}</span>
                        <button type="button" onclick="copyCode(this)" class="hover:text-white transition-colors flex items-center gap-2 pointer-events-auto"><i class="fas fa-copy"></i> Copy</button>
                    </div>
                    <pre class="p-4 text-[13px] text-gray-300 font-mono overflow-x-auto allow-select pointer-events-auto"><code>${escapeHTML(codeText)}</code></pre>
                </div>`;
            }
        };
        marked.use({ renderer });
        window.copyCode = function(btn) {
            navigator.clipboard.writeText(btn.closest('.relative').querySelector('code').innerText);
            btn.innerHTML = '<i class="fas fa-check text-green-400"></i> Copied';
            setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> Copy', 2000);
        };

        /* =========================================
           SETTINGS & DYNAMIC MODELS FETCHING
           ========================================= */
        function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
            
            const savedProvider = localStorage.getItem('_active_provider') || 'gemini';
            document.getElementById('ai-provider').value = savedProvider;
            onProviderChange();
        }
        
        function closeSettings() { 
            document.getElementById('settings-modal').classList.add('hidden'); 
            document.getElementById('settings-modal').classList.remove('flex'); 
            updateModelDisplay(); 
        }
        
        function onProviderChange() {
            const p = document.getElementById('ai-provider').value;
            const savedKey = localStorage.getItem(`_key_${p}`);
            
            try {
                document.getElementById('api-key-input').value = savedKey ? decKey(savedKey) : '';
            } catch (error) {
                document.getElementById('api-key-input').value = '';
            }
            
            // Muat ulang daftar model jika sudah pernah difetch sebelumnya
            const savedModels = localStorage.getItem(`_models_list_${p}`);
            const modelSection = document.getElementById('model-section');
            const selectModel = document.getElementById('ai-model');
            
            if (savedModels) {
                const modelsArr = JSON.parse(savedModels);
                selectModel.innerHTML = '';
                modelsArr.forEach(m => {
                    selectModel.innerHTML += `<option value="${m}">${m}</option>`;
                });
                
                const activeModel = localStorage.getItem(`_model_${p}`);
                if (activeModel && modelsArr.includes(activeModel)) {
                    selectModel.value = activeModel;
                }
                modelSection.classList.remove('hidden');
            } else {
                modelSection.classList.add('hidden');
            }
            
            document.getElementById('status-message').classList.add('hidden');
        }

        async function saveAndFetchModels() {
            const p = document.getElementById('ai-provider').value;
            const key = document.getElementById('api-key-input').value.trim();
            const statusBox = document.getElementById('status-message');
            const btn = document.getElementById('btn-verify');
            
            if(!key) {
                showStatus('API Key tidak boleh kosong!', 'error');
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memeriksa Key...';
            btn.disabled = true;

            try {
                let models = [];
                
                // 1. Ambil Model Gemini
                if (p === 'gemini') {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                    const data = await res.json();
                    if(data.error) throw new Error(data.error.message);
                    
                    models = data.models
                        .filter(m => m.supportedGenerationMethods.includes('generateContent'))
                        .map(m => m.name.replace('models/', ''));
                } 
                // 2. Ambil Model OpenAI
                else if (p === 'openai') {
                    const res = await fetch(`https://api.openai.com/v1/models`, {
                        headers: { 'Authorization': `Bearer ${key}` }
                    });
                    const data = await res.json();
                    if(data.error) throw new Error(data.error.message);
                    
                    models = data.data
                        .filter(m => m.id.includes('gpt') || m.id.includes('o1') || m.id.includes('o3'))
                        .map(m => m.id)
                        .sort();
                } 
                // 3. Ambil Model Claude (Anthropic)
                else if (p === 'claude') {
                    try {
                        const res = await fetch(`https://api.anthropic.com/v1/models`, {
                            headers: { 
                                'x-api-key': key, 
                                'anthropic-version': '2023-06-01', 
                                'anthropic-dangerous-direct-browser-access': 'true' 
                            }
                        });
                        const data = await res.json();
                        if(data.error) throw new Error(data.error.message);
                        models = data.models.map(m => m.id);
                    } catch (e) {
                        // Fallback jika API endpoint models terblokir CORS di browser
                        models = ['claude-3-7-sonnet-20250219', 'claude-3-5-sonnet-20241022', 'claude-3-5-haiku-20241022', 'claude-3-opus-20240229'];
                    }
                }

                if (models.length === 0) throw new Error("Tidak ada model chat yang ditemukan untuk API Key ini.");

                // Berhasil, simpan data ke LocalStorage
                localStorage.setItem(`_key_${p}`, encKey(key));
                localStorage.setItem('_active_provider', p);
                localStorage.setItem(`_models_list_${p}`, JSON.stringify(models));
                
                // Render ke Select Box
                const selectModel = document.getElementById('ai-model');
                selectModel.innerHTML = '';
                models.forEach(m => {
                    selectModel.innerHTML += `<option value="${m}">${m}</option>`;
                });
                
                document.getElementById('model-section').classList.remove('hidden');
                
                // Simpan model aktif pertama kali
                saveActiveModel();
                
                showStatus(`Berhasil! Ditemukan ${models.length} model.`, 'success');
            } catch (error) {
                showStatus(error.message, 'error');
            }

            btn.innerHTML = '<i class="fas fa-sync-alt"></i> Simpan & Verifikasi Key';
            btn.disabled = false;
        }

        function showStatus(msg, type) {
            const status = document.getElementById('status-message');
            status.classList.remove('hidden');
            status.className = `text-xs rounded-lg p-3 font-medium mt-3 block ${type === 'success' ? 'bg-green-900/40 text-green-400' : 'bg-red-900/40 text-red-400'}`;
            status.innerHTML = msg;
        }

        function saveActiveModel() { 
            const p = document.getElementById('ai-provider').value;
            localStorage.setItem('_active_provider', p); 
            localStorage.setItem(`_model_${p}`, document.getElementById('ai-model').value);
            updateModelDisplay();
        }
        
        function updateModelDisplay() {
            const p = localStorage.getItem('_active_provider') || 'Belum Diatur';
            const m = localStorage.getItem(`_model_${p}`) || 'Pilih Provider';
            let providerName = p === 'gemini' ? 'Gemini' : p === 'openai' ? 'OpenAI' : p === 'claude' ? 'Claude' : '';
            
            const modelDisplayElement = document.getElementById('active-model-display');
            if(modelDisplayElement) {
                modelDisplayElement.innerHTML = `${providerName}:${m}`;
            }
        }

        /* =========================================
           IMAGE GENERATION (AI TO PNG)
           ========================================= */
        function openImageModal() {
            document.getElementById('image-modal').classList.remove('hidden');
            document.getElementById('image-modal').classList.add('flex');
            document.getElementById('img-result-container').classList.add('hidden');
        }
        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
            document.getElementById('image-modal').classList.remove('flex');
        }
        function generateImage() {
            const prompt = document.getElementById('img-prompt').value.trim();
            const w = document.getElementById('img-width').value || 1024;
            const h = document.getElementById('img-height').value || 1024;
            if(!prompt) return alert('Prompt tidak boleh kosong!');
            
            const btn = document.getElementById('btn-generate-img');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
            btn.disabled = true;

            const seed = Math.floor(Math.random() * 99999999);
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${w}&height=${h}&seed=${seed}&nologo=true`;
            
            const img = document.getElementById('img-result');
            img.onload = () => {
                document.getElementById('img-result-container').classList.remove('hidden');
                document.getElementById('img-result-container').classList.add('flex');
                btn.innerHTML = '<i class="fas fa-paint-brush"></i> Generate Gambar';
                btn.disabled = false;
                currentGeneratedImgUrl = url;
            };
            img.onerror = () => {
                alert('Gagal membuat gambar.');
                btn.innerHTML = '<i class="fas fa-paint-brush"></i> Generate Gambar';
                btn.disabled = false;
            };
            img.src = url;
        }

        async function downloadGeneratedImage() {
            if(!currentGeneratedImgUrl) return;
            const btn = document.getElementById('dl-img-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mendownload...';
            try {
                const w = document.getElementById('img-width').value;
                const h = document.getElementById('img-height').value;
                const resp = await fetch(currentGeneratedImgUrl);
                const blob = await resp.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `AI_Gen_${w}x${h}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (e) {
                alert('Gagal mendownload gambar!');
            }
            btn.innerHTML = '<i class="fas fa-download"></i> Download PNG';
        }

        /* =========================================
           CHAT RENDERING & API EXECUTION
           ========================================= */
        function appendMessage(sender, text, files = [], metadata = null) {
            const cc = document.getElementById('chat-container');
            const wrap = document.createElement('div');
            wrap.className = `flex w-full ${sender === 'user' ? 'justify-end' : 'justify-start'} mb-2 relative chat-block`;
            
            const contentDiv = document.createElement('div');
            let html = '';
            
            if (files && files.length > 0) {
                html += `<div class="flex flex-wrap gap-2 mb-2 pointer-events-auto">`;
                files.forEach(f => {
                    const icon = f.type === 'image' ? 'fa-image' : 'fa-file-code';
                    html += `<div class="bg-[#2a2a2c] px-3 py-1.5 rounded-lg text-[11px] text-gray-300 font-mono"><i class="fas ${icon}"></i> ${f.name}</div>`;
                });
                html += `</div>`;
            }

            if (sender === 'user') {
                contentDiv.className = 'bg-[#1e1e1e] text-white px-5 py-3 rounded-[28px] max-w-[85%] text-[15px] leading-relaxed shadow-sm chat-bubble-content cursor-pointer';
                html += `<p class="whitespace-pre-wrap">${escapeHTML(text)}</p>`;
            } else {
                contentDiv.className = 'w-full ai-text text-gray-200 text-[15px] leading-relaxed overflow-hidden chat-bubble-content cursor-pointer';
                
                const thinkMatch = text.match(/<think>([\s\S]*?)<\/think>/i);
                if (thinkMatch) {
                    html += `<details class="think-box mb-4 bg-[#161618] border border-[#2a2a2c] rounded-2xl p-1 cursor-pointer pointer-events-auto">
                                <summary class="px-3 py-2 text-xs font-semibold text-gray-400 flex items-center gap-2"><i class="fas fa-stopwatch text-yellow-500"></i> Thinking Process</summary>
                                <div class="p-3 pt-1 text-[13px] text-gray-500 font-mono whitespace-pre-wrap">${escapeHTML(thinkMatch[1].trim())}</div>
                             </details>`;
                    html += marked.parse(text.replace(/<think>([\s\S]*?)<\/think>/i, '').trim());
                } else {
                    html += marked.parse(text);
                }

                if (metadata) {
                    html += `<div class="mt-4 pt-3 border-t border-[#2a2a2c] flex items-center gap-5 text-[12px] text-gray-500 font-mono pointer-events-auto">
                                <span><i class="fas fa-clock text-blue-400"></i> ${metadata.time}s</span>
                                <span><i class="fas fa-coins text-yellow-500"></i> ${metadata.tokens} Token</span>
                                <button onclick="restartGeneration(this)" class="hover:text-white transition-colors flex items-center gap-1.5 bg-[#2a2a2c] px-2 py-1 rounded-md cursor-pointer"><i class="fas fa-redo"></i> Jawab Ulang</button>
                             </div>`;
                }
            }
            
            contentDiv.innerHTML = html;
            wrap.appendChild(contentDiv);
            
            const welcomeMsg = cc.querySelector('.text-center.mt-10');
            if (welcomeMsg) welcomeMsg.remove();

            cc.appendChild(wrap);
            cc.scrollTo({ top: cc.scrollHeight, behavior: 'smooth' });

            let historyParts = [];
            if (text && text !== '[File Terlampir]') historyParts.push({ text: text });
            
            if (files && files.length > 0) {
                files.forEach(f => {
                    if (f.type === 'text') {
                        historyParts.push({ text: `\n\n--- Isi File: ${f.name} ---\n${f.content}\n--- Akhir File ---` });
                    } else if (f.type === 'image') {
                        historyParts.push({ inlineData: { data: f.content, mimeType: f.mimeType } });
                    }
                });
            }
            if(historyParts.length === 0) historyParts.push({text: "Tolong analisa file yang dilampirkan."});

            chatHistory.push({ role: sender === 'ai' ? 'assistant' : 'user', content: text, parts: historyParts });
        }
        
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)); }

        function appendTyping() {
            aiStartTime = Date.now();
            const cc = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.id = 'typing';
            div.className = 'flex w-full justify-start mb-2';
            div.innerHTML = `<div class="bg-[#1e1e1e] border border-[#2a2a2c] rounded-full px-5 py-2.5 flex items-center gap-4">
                                <div class="text-blue-400 text-sm flex gap-1 items-center"><i class="fas fa-circle text-[8px] animate-pulse"></i><i class="fas fa-circle text-[8px] animate-pulse" style="animation-delay:0.2s"></i><i class="fas fa-circle text-[8px] animate-pulse" style="animation-delay:0.4s"></i></div>
                                <span id="ai-timer" class="text-xs text-yellow-500 font-mono font-bold tracking-widest">0.0s</span>
                             </div>`;
            cc.appendChild(div);
            cc.scrollTo({ top: cc.scrollHeight, behavior: 'smooth' });

            timerInterval = setInterval(() => {
                const el = document.getElementById('ai-timer');
                if(el) el.innerText = ((Date.now() - aiStartTime) / 1000).toFixed(1) + 's';
            }, 100);
        }
        
        function removeTyping() { 
            clearInterval(timerInterval);
            const el = document.getElementById('typing'); 
            if(el) el.remove(); 
        }

        const SYSTEM_PROMPT = `Kamu adalah AI ahli bahasa pemrograman Lua KHUSUS untuk server GTPS Cloud (GTPS10).
Tugasmu adalah membuat, menganalisis, atau memperbaiki script Lua sesuai spesifikasi GTPS Cloud. Referensi ekstensif API dan contoh command telah disediakan di memori mu. 

ATURAN FORMAT BALASAN:
- LANGSUNG BERIKAN SCRIPT LUA-NYA DALAM SATU BALASAN! JANGAN bertele-tele, JANGAN meminta konfirmasi, dan JANGAN menunda memberikan kode.
- SEBELUM menuliskan blok kode script (\`\`\`lua), kamu WAJIB memberikan JUDUL SCRIPT terlebih dahulu.
- SELALU gunakan tag <think>...</think> di awal responmu untuk menjelaskan pemikiran dan analisamu secara mendalam.

--- RINGKASAN GTPS CLOUD LUA API ---
Global Functions: registerLuaCommand, registerLuaPlaymod, getServerPlayers, getServerWorlds, getItem, print, saveStringToServer, loadStringFromServer, saveDataToServer, loadDataFromServer, file.write, file.read, file.exists, timer.setTimeout, timer.setInterval, getItemsCount, getActiveDailyOffers, formatTime.
Player Class: getName, getNetID, getCleanName, hasRole, getRole, onConsoleMessage, onTalkBubble, onDialogRequest, getGems, addGems, setGems, removeGems, getItemAmount, changeItem, getPosX, getPosY, playAudio, disconnect, ban, sendRawPacket, hasAccessToTile, addInventorySpace.
World Class: getName, getPlayers, getTile, spawnItem, useItemEffect, onCreateChatBubble, setWeather, getTileDroppedItems, useConsumable.
Tile Class: getTileID, getFlags, getPosX, getPosY, getTileData, setTileData.
Callbacks Utama: onPlayerCommandCallback, onPlayerDialogCallback, onPlayerChatCallback, onPlayerJoinCallback, onPlayerDeathCallback.`;

        function handleFormSubmit(e) {
            e.preventDefault();
            const txt = document.getElementById('user-input').value.trim();
            if(!txt && attachedFiles.length === 0) return;
            
            document.getElementById('user-input').value = '';
            document.getElementById('user-input').style.height = 'auto';
            
            const att = [...attachedFiles];
            clearAllAttachments();
            
            appendMessage('user', txt || '[File Terlampir]', att);
            processAI();
        }

        window.restartGeneration = function(btn) {
            btn.closest('.chat-block').remove();
            if(chatHistory.length > 0 && chatHistory[chatHistory.length-1].role === 'assistant') chatHistory.pop();
            processAI();
        };

        async function processAI() {
            const p = localStorage.getItem('_active_provider');
            if(!p) { openSettings(); return; }
            const encKeyVal = localStorage.getItem(`_key_${p}`);
            if(!encKeyVal) { openSettings(); return; }
            
            let apiKey = "";
            try {
                apiKey = decKey(encKeyVal);
            } catch (error) {
                alert("API Key tidak valid. Silakan atur ulang di setelan.");
                localStorage.removeItem(`_key_${p}`);
                openSettings(); return;
            }

            const model = localStorage.getItem(`_model_${p}`);
            appendTyping();

            try {
                let resText = "";
                let tokens = "N/A";
                const lastUserMsg = chatHistory[chatHistory.length - 1];
                const lastTxt = lastUserMsg ? lastUserMsg.content : "";

                // Eksekusi API sesuai dengan Provider yang dipilih
                if (p === 'gemini') {
                    const history = chatHistory.map(h => ({
                        role: h.role === 'assistant' ? 'model' : h.role,
                        parts: h.parts
                    }));
                    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ system_instruction: { parts: [{ text: SYSTEM_PROMPT }] }, contents: history, generationConfig: { temperature: 0.4 } })
                    });
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.error?.message || 'Error API Gemini');
                    resText = d.candidates[0].content.parts[0].text;
                    tokens = d.usageMetadata?.totalTokenCount || "N/A";
                } 
                else if (p === 'openai') {
                    let messages = [{role: 'system', content: SYSTEM_PROMPT}];
                    chatHistory.forEach(h => {
                        let contentArr = [];
                        h.parts.forEach(pt => {
                            if(pt.text) contentArr.push({type: 'text', text: pt.text});
                            if(pt.inlineData) contentArr.push({type: 'image_url', image_url: {url: `data:${pt.inlineData.mimeType};base64,${pt.inlineData.data}`}});
                        });
                        messages.push({role: h.role, content: contentArr});
                    });

                    const r = await fetch(`https://api.openai.com/v1/chat/completions`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                        body: JSON.stringify({ model: model, messages: messages, temperature: 0.4 })
                    });
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.error?.message || 'Error API OpenAI');
                    resText = d.choices[0].message.content;
                    tokens = d.usage?.total_tokens || "N/A";
                }
                else if (p === 'claude') {
                    let messages = [];
                    chatHistory.forEach(h => {
                        let contentArr = [];
                        h.parts.forEach(pt => {
                            if(pt.text) contentArr.push({type: 'text', text: pt.text});
                            if(pt.inlineData) contentArr.push({type: 'image', source: {type: 'base64', media_type: pt.inlineData.mimeType, data: pt.inlineData.data}});
                        });
                        messages.push({role: h.role, content: contentArr});
                    });

                    const r = await fetch(`https://api.anthropic.com/v1/messages`, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
                        body: JSON.stringify({ model: model, system: SYSTEM_PROMPT, messages: messages, max_tokens: 4096, temperature: 0.4 })
                    });
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.error?.message || 'Error API Claude');
                    resText = d.content[0].text;
                    tokens = (d.usage?.input_tokens + d.usage?.output_tokens) || "N/A";
                }

                removeTyping();
                const timeTaken = ((Date.now() - aiStartTime) / 1000).toFixed(2);
                appendMessage('ai', resText, [], { time: timeTaken, tokens: tokens, lastPrompt: lastTxt });
            } catch(err) {
                removeTyping();
                appendMessage('ai', `**Error Sistem:** ${err.message}`);
            }
        }

        /* =========================================
           SECURITY & UX (ANTI F12, HOLD TO COPY)
           ========================================= */
        
        document.addEventListener('contextmenu', function(e) {
            if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
            }
        });

        let holdTimer;
        const HOLD_DURATION = 600;

        document.addEventListener('touchstart', handleHoldStart, {passive: true});
        document.addEventListener('touchend', handleHoldEnd);
        document.addEventListener('touchmove', handleHoldEnd);
        document.addEventListener('mousedown', handleHoldStart);
        document.addEventListener('mouseup', handleHoldEnd);
        document.addEventListener('mousemove', handleHoldEnd);

        function handleHoldStart(e) {
            const bubble = e.target.closest('.chat-bubble-content');
            if (!bubble || e.target.closest('button') || e.target.closest('details') || e.target.tagName === 'CODE') return;

            holdTimer = setTimeout(() => {
                const textToCopy = bubble.innerText;
                if (textToCopy.trim()) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        showCopyToast(e);
                    });
                }
            }, HOLD_DURATION);
        }

        function handleHoldEnd() { clearTimeout(holdTimer); }

        function showCopyToast(e) {
            let x, y;
            if (e.touches && e.touches.length > 0) { x = e.touches[0].clientX; y = e.touches[0].clientY; } 
            else { x = e.clientX; y = e.clientY; }

            const toast = document.createElement('div');
            toast.innerHTML = '<i class="fas fa-check-circle"></i> Teks Disalin!';
            toast.className = 'fixed bg-[#4CAF50] text-white px-4 py-2 rounded-full text-xs font-bold shadow-2xl z-[9999] animate-pop-in flex items-center gap-2 pointer-events-none';
            toast.style.left = `${x}px`; toast.style.top = `${y - 60}px`; toast.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.4s ease-out'; setTimeout(() => toast.remove(), 400); }, 1200);
        }
    </script>
