<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTPS.cloud Script AI Generator</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing (Code blocks) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* Security: Mencegah text-selection, highlight, dan hold/tap di mobile */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        /* Mengizinkan seleksi hanya di dalam blok kode hasil AI */
        .allow-select, .chat-message pre, .chat-message code {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .chat-bg { background-color: #111827; }
        .glass-panel { background: rgba(31, 41, 55, 0.8); backdrop-filter: blur(10px); }
        .typing-indicator span {
            display: inline-block; width: 6px; height: 6px; background-color: #9ca3af;
            border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="chat-bg text-gray-200 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="glass-panel border-b border-gray-700 p-4 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg"><i class="fas fa-robot text-white"></i></div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">GTPS Script AI</h1>
        </div>
        <button onclick="openSettings()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-all shadow border border-gray-600 flex items-center gap-2">
            <i class="fas fa-cog"></i> Pengaturan API
        </button>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6 flex flex-col scroll-smooth">
        <!-- Welcome Message -->
        <div class="flex items-start gap-4">
            <div class="bg-blue-600 rounded-full w-10 h-10 flex items-center justify-center shrink-0">
                <i class="fas fa-robot text-white"></i>
            </div>
            <div class="bg-gray-800 rounded-2xl rounded-tl-none p-4 max-w-[80%] shadow-lg border border-gray-700">
                <p>Halo! Saya adalah AI khusus pembuat Script Lua untuk <strong>GTPS.cloud</strong>. Silakan atur API Key Anda di Pengaturan terlebih dahulu, lalu beri tahu saya script apa yang ingin Anda buat.</p>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="glass-panel border-t border-gray-700 p-4 pb-6">
        <form id="chat-form" class="max-w-5xl mx-auto flex gap-3 relative">
            <textarea id="user-input" rows="1" class="allow-select flex-1 bg-gray-800 text-white border border-gray-600 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none overflow-hidden" placeholder="Ketik perintah script (contoh: Buatkan script untuk auto-farm block)..." oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
            <button type="submit" id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-xl flex items-center justify-center transition-all disabled:opacity-50 disabled:cursor-not-allowed self-end">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative transform scale-95 transition-transform" id="modal-content">
            <button onclick="closeSettings()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-2xl font-bold mb-6 text-white flex items-center gap-2"><i class="fas fa-shield-alt text-green-400"></i> Pengaturan AI</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Pilih Model AI</label>
                    <select id="ai-model" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash (Cepat)</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro (Lebih Pintar)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Google Gemini API Key</label>
                    <input type="password" id="api-key-input" class="allow-select w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="AIzaSy...">
                    <p class="text-xs text-gray-500 mt-2"><i class="fas fa-lock"></i> API Key disimpan aman menggunakan Session Enkripsi sementara.</p>
                </div>
                
                <div id="status-message" class="text-sm hidden rounded-lg p-3"></div>

                <button id="save-btn" onclick="saveAndVerifyAPI()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Simpan & Verifikasi
                </button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           SECURITY MEASURES (Anti-Theft)
           ========================================= */
        document.addEventListener('contextmenu', event => event.preventDefault()); // Disable Right Click
        document.addEventListener('keydown', function(e) {
            // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S
            if (e.keyCode === 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
               (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('dragstart', event => event.preventDefault()); // Disable dragging
        
        /* =========================================
           DATA DOKUMEN GTPS API (SYSTEM PROMPT)
           ========================================= */
        // Diambil dan dirangkum dari Dokumen Lengkap GTPS.Cloud Lua API
        const GTPS_DOCS = `
Kamu adalah developer ahli bahasa pemrograman Lua khusus untuk server GTPS.cloud.
Tugasmu adalah membuat script berdasarkan dokumentasi resmi GTPS.cloud Lua API.
Berikan kodenya secara langsung di dalam block markdown Lua, berikan sedikit penjelasan jika perlu.

REFERENSI GTPS API:
- **Player Class**: getName(), enterWorld(), getPosX(), getPosY(), getNetID(), hasMod(modID), hasRole(roleID), addMod(), getItemAmount(itemID), getXP(), setXP(), getLevel(), getGems(), addGems(), removeGems(), playAudio(), sendVariant(variantList), sendRawPacket(data), disconnect(), ban(), setRoleQuestLevel(), getInventoryItems(), doAction(str), getFriends(), getGrowpassPoints(), earnAchievement(), getOverlappingTiles().
- **World Class**: getName(), getOwner(), addPunishment(), getTile(x,y), spawnItem(x,y,itemID,count), spawnGems(), getPlayers(), isGameActive(), onCreateExplosion(), setTileForeground(), getTiles(), removeDroppedItemsByID(), sendPlayerMessage(), placeTile(), hasTileAccess(), kill(), createNPC(), findNPCByName(), setWeather(), nuke(), setMachineCap(), getMachineCaps().
- **Tile Class**: getTileID(), getTileItem(), getPosX(), getPosY(), getFlags(), getTileData().
- **Item Class**: getName(), getID(), getPrice(), getCategoryType(), getTexture(), setFarmability().
- **Guild Class**: getTitle(), getLevel(), getPoints(), addXP().
- **Global Functions**: registerLuaPlaymod(config), registerLuaCommand(config), registerLuaEvent(config), registerLuaItem(config), getItem(itemID), getServerPlayers(), getServerWorlds(), getPlayer(userID), getPlayerByName(playerName), savePlayer(), print(...), getTodaysDate(), formatTime(), addCombinerRecipe().
- **Callbacks Penting**: 
  - onPlayerChatCallback(world, player, message)
  - onPlayerCommandCallback(world, player, command)
  - onPlayerLoginCallback(player)
  - onPlayerDeathCallback(world, player, spikeKill)
  - onPlayerActionCallback(world, player, action)
  - onTileBreakCallback(world, player, tile)
  - onTilePunchCallback(world, player, tile)
  - onPlayerPunchPlayerCallback(world, player, targetPlayer)
  - onTick()
  - onWorldTick(world)
  - onPlayerVariantCallback(player, variant, delay, netID)
- **Utilities**: timer.setTimeout, timer.setInterval, http.get, http.post, file.read, db.open.

ATURAN SCRIPT:
1. Pastikan selalu menggunakan fungsi yang terdaftar di atas. 
2. Script harus optimal dan menggunakan event callback yang tepat jika diminta membuat fitur interaktif (seperti command, dll).
3. Jika menggunakan timer, pastikan menyimpan timerID jika butuh di-clear.
`;

        /* =========================================
           STATE & LOGIC
           ========================================= */
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const settingsModal = document.getElementById('settings-modal');
        const modalContent = document.getElementById('modal-content');
        
        let chatHistory = [
            { role: "user", parts: [{ text: "System prompt instructions injected." }]},
            { role: "model", parts: [{ text: "Understood." }]}
        ];

        // Basic Security Obfuscation for storing API Key in Session Storage
        const encKey = str => btoa(encodeURIComponent(str));
        const decKey = str => decodeURIComponent(atob(str));

        function openSettings() {
            settingsModal.classList.remove('hidden');
            settingsModal.classList.add('flex');
            setTimeout(() => modalContent.classList.remove('scale-95'), 10);
            
            const saved = sessionStorage.getItem('_gta');
            if(saved) document.getElementById('api-key-input').value = decKey(saved);
        }

        function closeSettings() {
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                settingsModal.classList.add('hidden');
                settingsModal.classList.remove('flex');
            }, 200);
        }

        async function saveAndVerifyAPI() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            const model = document.getElementById('ai-model').value;
            const statusDiv = document.getElementById('status-message');
            const saveBtn = document.getElementById('save-btn');

            if (!apiKey) {
                showStatus(statusDiv, 'API Key tidak boleh kosong!', 'error');
                return;
            }

            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi...';
            saveBtn.disabled = true;

            try {
                // Minimal Request to Verify Key
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Ping" }] }]
                    })
                });

                if (response.ok) {
                    sessionStorage.setItem('_gta', encKey(apiKey));
                    sessionStorage.setItem('_mdl', model);
                    showStatus(statusDiv, 'Verifikasi Berhasil! API Key tersimpan.', 'success');
                    setTimeout(() => closeSettings(), 1500);
                } else {
                    const err = await response.json();
                    showStatus(statusDiv, `Gagal: ${err.error.message || 'API Key Invalid'}`, 'error');
                }
            } catch (error) {
                showStatus(statusDiv, 'Koneksi error saat memverifikasi API Key.', 'error');
            } finally {
                saveBtn.innerHTML = '<i class="fas fa-save"></i> Simpan & Verifikasi';
                saveBtn.disabled = false;
            }
        }

        function showStatus(element, text, type) {
            element.className = `text-sm rounded-lg p-3 block ${type === 'error' ? 'bg-red-900/50 text-red-300 border border-red-700' : 'bg-green-900/50 text-green-300 border border-green-700'}`;
            element.innerHTML = text;
        }

        function appendMessage(sender, text) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start gap-4 ${sender === 'user' ? 'flex-row-reverse' : ''}`;
            
            const icon = sender === 'user' 
                ? `<div class="bg-purple-600 rounded-full w-10 h-10 flex items-center justify-center shrink-0"><i class="fas fa-user text-white"></i></div>`
                : `<div class="bg-blue-600 rounded-full w-10 h-10 flex items-center justify-center shrink-0"><i class="fas fa-robot text-white"></i></div>`;
            
            const bubble = document.createElement('div');
            bubble.className = sender === 'user'
                ? `bg-purple-600 text-white rounded-2xl rounded-tr-none p-4 max-w-[80%] shadow-lg allow-select`
                : `bg-gray-800 text-gray-200 rounded-2xl rounded-tl-none p-4 max-w-[80%] shadow-lg border border-gray-700 chat-message allow-select`;
            
            if(sender === 'ai') {
                bubble.innerHTML = marked.parse(text); // Render Markdown
            } else {
                bubble.textContent = text;
            }

            wrapper.innerHTML = icon;
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function showTyping() {
            const wrapper = document.createElement('div');
            wrapper.id = 'typing-indicator';
            wrapper.className = `flex items-start gap-4`;
            wrapper.innerHTML = `
                <div class="bg-blue-600 rounded-full w-10 h-10 flex items-center justify-center shrink-0"><i class="fas fa-robot text-white"></i></div>
                <div class="bg-gray-800 rounded-2xl rounded-tl-none p-5 shadow-lg border border-gray-700 typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function removeTyping() {
            const el = document.getElementById('typing-indicator');
            if(el) el.remove();
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            
            const encApiKey = sessionStorage.getItem('_gta');
            if (!encApiKey) {
                openSettings();
                showStatus(document.getElementById('status-message'), 'Harap masukkan API Key terlebih dahulu!', 'error');
                return;
            }

            // UI Updates
            userInput.value = '';
            userInput.style.height = 'auto';
            appendMessage('user', text);
            sendBtn.disabled = true;
            showTyping();

            const apiKey = decKey(encApiKey);
            const model = sessionStorage.getItem('_mdl') || 'gemini-1.5-flash';
            
            // Push user prompt to history
            chatHistory.push({ role: "user", parts: [{ text: text }]});

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                
                // Add System Instruction wrapper securely on request time
                const payload = {
                    system_instruction: { parts: [{ text: GTPS_DOCS }] },
                    contents: chatHistory,
                    generationConfig: { temperature: 0.2 }
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                removeTyping();

                if (response.ok) {
                    const data = await response.json();
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage('ai', reply);
                    chatHistory.push({ role: "model", parts: [{ text: reply }]});
                } else {
                    const err = await response.json();
                    appendMessage('ai', `**Error:** Terjadi kesalahan dari API. Pesan: \`${err.error.message}\``);
                    chatHistory.pop(); // Remove failed prompt
                }
            } catch (error) {
                removeTyping();
                appendMessage('ai', `**Error:** Koneksi terputus atau gagal menghubungi API.`);
                chatHistory.pop();
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        });

        // Submit via enter but allow Shift+Enter for new line
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
