<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - GTPS Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex items-center justify-center font-sans">
    <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="bg-emerald-500/20 text-emerald-400 w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fas fa-terminal"></i>
            </div>
            <h1 class="text-xl font-bold text-white">GTPS Script Studio</h1>
            <p class="text-xs text-gray-400 mt-1">Silakan Login atau Register untuk masuk</p>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Email</label>
                <input type="email" id="email" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="email@domain.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Username</label>
                <input type="text" id="username" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Nama pengguna">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="••••••••">
            </div>
            
            <div id="auth-msg" class="text-xs text-red-400 hidden text-center bg-red-950/40 p-2 rounded-lg border border-red-900/50"></div>

            <div class="flex gap-3 pt-2">
                <button type="submit" onclick="authAction = 'login'" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-lg">Login</button>
                <button type="submit" onclick="authAction = 'register'" class="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white font-bold py-2.5 rounded-xl text-xs transition-all">Register</button>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://ynqydnmpujjtebflfawo.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucXlkbm1wdWpqdGViZmZsYXdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjMxODQsImV4cCI6MjEwNTYzOTE4NH0.hSOiRrlG1a4_GxyQumG4EATv3l20ZdP26-KeSKW-d4E'; 
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let authAction = 'login';

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');
            msg.classList.add('hidden');

            if (authAction === 'register') {
                const { error } = await supabase.auth.signUp({ 
                    email, 
                    password,
                    options: { data: { username: username } }
                });
                if (error) { 
                    msg.textContent = error.message; 
                    msg.classList.remove('hidden'); 
                } else { 
                    alert("Registrasi berhasil! Silakan klik tombol Login."); 
                }
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) { 
                    msg.textContent = error.message; 
                    msg.classList.remove('hidden'); 
                } else { 
                    window.location.href = '../index.html'; 
                }
            }
        }
    </script>
</body>
</html>
